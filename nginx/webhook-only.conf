server {
  listen 8081;
  # Docker troca o IP de um container recriado. A variável força resolução em
  # runtime. O proxy não grava access log: a query token da Efí nunca chega a
  # disco por esta camada.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  set $core_api core-api:8080;
  access_log off;
  location = /webhooks/waha {
    if ($request_method != POST) { return 404; }
    proxy_pass http://$core_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Webhooks financeiros (Fase 6): um por provedor, POST-only, mesmo proxy.
  location ~ ^/webhooks/billing/[a-z]+$ {
    if ($request_method != POST) { return 404; }
    proxy_pass http://$core_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { return 404; }
}
