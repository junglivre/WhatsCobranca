server {
  listen 8081;
  location = /webhooks/waha {
    if ($request_method != POST) { return 404; }
    proxy_pass http://core-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Webhooks financeiros (Fase 6): um por provedor, POST-only, mesmo proxy.
  location ~ ^/webhooks/billing/[a-z]+$ {
    if ($request_method != POST) { return 404; }
    proxy_pass http://core-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { return 404; }
}
