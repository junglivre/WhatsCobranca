name: whatscobranca
services:
  postgres:
    image: postgres:16.8-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatscobranca}
      POSTGRES_USER: ${POSTGRES_USER:-whatscobranca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run bootstrap:env first}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
  core-api:
    build:
      context: ./core-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:?run bootstrap}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:?run bootstrap}
      WAHA_BASE_URL: ${WAHA_BASE_URL:?set your WAHA instance URL in .env}
      WAHA_API_KEY: ${WAHA_API_KEY:?set by supervisor}
      WAHA_SESSION: ${WAHA_SESSION:?set your WAHA session name in .env}
      OPERATOR_LID: ${OPERATOR_LID:?set the authorized operator literal @lid in .env}
      OPERATOR_PHONE: ${OPERATOR_PHONE:?set the authorized operator literal @c.us in .env}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(x=>process.exit(x.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
  n8n-schema:
    image: postgres:16.8-bookworm
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-whatscobranca}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run bootstrap}
      PGDATABASE: ${POSTGRES_DB:-whatscobranca}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-c", "CREATE SCHEMA IF NOT EXISTS n8n;"]
    depends_on: {postgres: {condition: service_healthy}}
  n8n-init:
    image: n8nio/n8n:1.112.5
    restart: "no"
    environment: &n8n_env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-whatscobranca}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-whatscobranca}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run bootstrap}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:?run bootstrap}
    volumes: [./n8n/workflows:/workflows:ro,n8n_data:/home/node/.n8n]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - n8n import:workflow --input=/workflows/poc1-tick.json && n8n update:workflow --id=WhatsCobrancaPoc1Tick --active=true
    depends_on: {n8n-schema: {condition: service_completed_successfully}}
  n8n:
    image: n8nio/n8n:1.112.5
    restart: unless-stopped
    environment:
      <<: *n8n_env
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5678/
    ports: ["127.0.0.1:5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on: {n8n-init: {condition: service_completed_successfully}, core-api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(x=>process.exit(x.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  webhook-proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8081"]
    volumes: [./nginx/webhook-only.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: {core-api: {condition: service_healthy}}
volumes: {postgres_data: {}, n8n_data: {}}
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.245.210.0/24}
